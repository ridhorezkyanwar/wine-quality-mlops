global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "tf-serving-monitor"

scrape_configs:
  - job_name: "wine-quality-tf-serving"
    static_configs:
      - targets: ["tf-serving:8501"]
    metrics_path: "/monitoring/prometheus/metrics"
    scrape_interval: 5s
