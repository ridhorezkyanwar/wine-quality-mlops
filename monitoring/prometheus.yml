global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "tf-serving-monitor"

scrape_configs:
  - job_name: "prometheus"
    scheme: https
    metrics_path: "/monitoring/prometheus/metrics"
    static_configs:
      - targets: ["wine-quality-mlops-production.up.railway.app"]
    scrape_interval: 5s
