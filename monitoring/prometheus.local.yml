global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "tf-serving-local"

scrape_configs:
  - job_name: "tf-serving"
    metrics_path: "/monitoring/prometheus/metrics"
    static_configs:
      - targets: ["tf-serving:8501"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
