services:
  tf-serving:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 8501
    ports:
      - "8501:8501"
    restart: unless-stopped

  prometheus:
    build:
      context: ./monitoring
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    depends_on:
      - tf-serving
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.0.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana_data:
