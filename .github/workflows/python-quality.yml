name: Wine ML quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Compile project scripts
        run: python -m compileall -q app.py pipeline.py prepare_data.py modules/

      - name: Install lightweight test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Run dataset preparation tests
        run: python -m pytest -q tests/

      - name: Verify committed dataset is reproducible
        run: |
          python prepare_data.py
          git diff --exit-code -- data/wine_quality.csv
